name: Build CyberX Gemini WA Bot APK (Universal)

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-android-apk:
    name: Compile Engine & Build CyberX APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Ekstrak Proyek ZIP & Deteksi Versi Otomatis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts[].id' 2>/dev/null | head -n 30 | xargs -r -n1 -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{} 2>/dev/null || true
          for z in gemini-wa-bot-apk-github.zip *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o -q "$z"
              break
            fi
          done
          chmod +x gradlew || true
          VER=$(grep -oE 'versionName = "[0-9]+\.[0-9]+' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+\.[0-9]+' || echo "5.8")
          echo "BOT_VER=$VER" >> $GITHUB_ENV
          echo "Detected version: v$VER"

      - name: 3. Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: 4. Compile Embedded Go Engine (Android arm64 + Linux VPS amd64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          cd engine
          rm -f go.mod go.sum
          go mod init gemini-wabot-engine
          go get go.mau.fi/whatsmeow@latest golang.org/x/crypto/ssh@latest golang.org/x/crypto/x509roots/fallback@latest google.golang.org/protobuf/proto@latest modernc.org/sqlite@latest
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libwabot_engine.so main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../app/src/main/jniLibs/x86_64/libwabot_engine.so main.go
          cd ..
          ls -lh app/src/main/jniLibs/arm64-v8a/libwabot_engine.so app/src/main/jniLibs/x86_64/libwabot_engine.so

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          dependency-graph: disabled

      - name: 7. Build Signed CyberX APK
        run: |
          gradle assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "Gemini-WA-Bot-v${{ env.BOT_VER }}.apk"
          ls -lh "Gemini-WA-Bot-v${{ env.BOT_VER }}.apk"

      - name: 8. Publish APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BOT_VER }}.${{ github.run_number }}
          name: "CyberX / Gemini WA Bot APK v${{ env.BOT_VER }} Build #${{ github.run_number }}"
          body: |
            ### CyberX / Gemini WhatsApp Bot APK v${{ env.BOT_VER }}
            Klik **`Gemini-WA-Bot-v${{ env.BOT_VER }}.apk`** di bawah bagian **Assets** untuk langsung men-download APK!
          files: Gemini-WA-Bot-v${{ env.BOT_VER }}.apk

      - name: 9. Tampilkan Link Download Langsung di Summary
        run: |
          echo "### ✅ CyberX APK v${{ env.BOT_VER }} Berhasil Dibuat!" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[DOWNLOAD Gemini-WA-Bot-v${{ env.BOT_VER }}.apk](https://github.com/${{ github.repository }}/releases/download/v${{ env.BOT_VER }}.${{ github.run_number }}/Gemini-WA-Bot-v${{ env.BOT_VER }}.apk)**" >> $GITHUB_STEP_SUMMARY

      - name: 10. Upload APK ke Workflow Artifacts (Opsional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Gemini-WA-Bot-APK-v${{ env.BOT_VER }}
          path: Gemini-WA-Bot-v${{ env.BOT_VER }}.apk
          retention-days: 1
          if-no-files-found: ignore
